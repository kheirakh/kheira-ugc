  - name: collab
    label: Espace marques (page privée)
    type: file
    path: collab.json
    format: json
    fields:
      - name: intro
        label: Introduction
        type: object
        fields:
          - { name: petit_titre, label: Petit titre, type: string }
          - { name: titre, label: Titre, type: string }
          - { name: texte, label: Texte, type: text }
          - { name: photo, label: Photo, type: image }
      - name: stats
        label: Statistiques
        type: object
        fields:
          - { name: petit_titre, label: Petit titre, type: string }
          - { name: titre, label: Titre, type: string }
          - { name: periode, label: "Période (ex. Instagram · 30 derniers jours)", type: string }
          - name: chiffres
            label: Chiffres
            type: object
            list: true
            fields:
              - { name: chiffre, label: Chiffre, type: string }
              - { name: libelle, label: Texte sous le chiffre, type: string }
          - { name: audience, label: Audience (une ligne par info), type: string, list: true }
          - { name: performances, label: Performances moyennes (une ligne par info), type: string, list: true }
      - name: galerie
        label: Galerie de photos
        type: object
        fields:
          - { name: petit_titre, label: Petit titre, type: string }
          - { name: photos, label: "Photos (6 conseillées)", type: image, list: true }
      - name: deroule
        label: Déroulé
        type: object
        fields:
          - { name: petit_titre, label: Petit titre, type: string }
          - { name: titre, label: Titre, type: string }
          - name: etapes
            label: Étapes
            type: object
            list: true
            fields:
              - { name: titre, label: Titre de l'étape, type: string }
              - { name: texte, label: Texte, type: text }
      - name: tarifs
        label: Tarifs
        type: object
        fields:
          - { name: petit_titre, label: Petit titre, type: string }
          - { name: titre, label: Titre, type: string }
          - name: influence
            label: Carte collaboration d'influence
            type: object
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: sous_titre, label: Sous-titre, type: string }
              - name: items
                label: Formules
                type: object
                list: true
                fields:
                  - { name: nom, label: Nom de la formule, type: string }
                  - { name: prix, label: "Prix (ex. 180 €)", type: string }
                  - { name: texte, label: Description, type: text }
                  - { name: badge, label: "Badge (facultatif, ex. Meilleure formule)", type: string }
          - name: ugc
            label: Carte création UGC
            type: object
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: sous_titre, label: Sous-titre, type: string }
              - name: items
                label: Formules
                type: object
                list: true
                fields:
                  - { name: nom, label: Nom de la formule, type: string }
                  - { name: prix, label: "Prix (ex. 180 €)", type: string }
                  - { name: texte, label: Description, type: text }
                  - { name: badge, label: "Badge (facultatif, ex. Meilleure formule)", type: string }
          - name: stories
            label: Encadré sur les stories
            type: object
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: texte, label: Texte, type: text }
          - name: options
            label: Options (droits ads)
            type: object
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: texte, label: Texte, type: text }
              - name: items
                label: Options
                type: object
                list: true
                fields:
                  - { name: nom, label: Option, type: string }
                  - { name: prix, label: Prix, type: string }
          - { name: gifting, label: Phrase sur le gifting, type: text }
      - name: conditions
        label: Conditions
        type: object
        fields:
          - { name: petit_titre, label: Petit titre, type: string }
          - { name: titre, label: Titre, type: string }
          - { name: liste, label: Conditions (une par ligne), type: text, list: true }
      - name: brief
        label: Formulaire de brief
        type: object
        fields:
          - { name: petit_titre, label: Petit titre, type: string }
          - { name: titre, label: Titre, type: string }
          - { name: texte, label: Texte, type: text }
          - { name: types, label: Choix « Type de collaboration », type: string, list: true }
          - { name: objectifs, label: Choix « Objectif », type: string, list: true }
          - { name: droits, label: Choix « Droits d'utilisation », type: string, list: true }
          - { name: envoi, label: Choix « Envoi du produit », type: string, list: true }
          - { name: budgets, label: Choix « Budget », type: string, list: true }
          - { name: bouton, label: Texte du bouton, type: string }
          - { name: merci, label: Message après l'envoi, type: text }
          - { name: photo, label: "Photo à côté du brief (ordinateur)", type: image }
