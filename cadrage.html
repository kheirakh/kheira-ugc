<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cadrage des photos | Kheira</title>
<style>
  :root{--espresso:#3b2a20;--brown:#6b5244;--beige:#e8dccd;--cream:#f7efe4;--gold:#b08a68;--ink:#3b2a20}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Futura,"Futura PT","Jost","Century Gothic",sans-serif;background:var(--beige);color:var(--ink);min-height:100vh}
  header{padding:22px 24px 10px;text-align:center}
  h1{font-weight:500;font-size:22px;letter-spacing:.04em}
  header p{font-size:14px;color:var(--brown);margin-top:6px;line-height:1.5}
  .app{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr) minmax(0,300px);gap:20px;max-width:1300px;margin:0 auto;padding:16px 24px 40px}
  .panel{background:var(--cream);border:1px solid rgba(107,82,68,.2);border-radius:18px;padding:16px}
  .panel h2{font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:6px 0 10px}
  .list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:72vh;overflow:auto;padding-right:4px}
  .thumb{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:#ddd}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb.is-active{border-color:var(--espresso)}
  .thumb span{position:absolute;left:4px;top:4px;background:rgba(59,42,32,.8);color:var(--cream);font-size:10px;border-radius:999px;padding:2px 7px}
  .thumb.is-set::after{content:"✓";position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:50%;background:#5d7a4f;color:#fff;font-size:11px;display:grid;place-items:center}
  .stage{display:flex;flex-direction:column;align-items:center;gap:12px}
  .pick{position:relative;max-width:100%;cursor:crosshair;user-select:none;touch-action:none;border-radius:14px;overflow:hidden;background:#222}
  .pick img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;pointer-events:none}
  .dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#2f6bff;border:4px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.45);pointer-events:none}
  .hint{font-size:14px;color:var(--brown);text-align:center}
  .preview-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .preview{aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:#ddd}
  .preview.carre{aspect-ratio:1/1}
  .preview img{width:100%;height:100%;object-fit:cover;display:block}
  .cap{font-size:11px;color:var(--brown);text-align:center;margin-top:4px}
  .code{font-size:26px;font-weight:500;text-align:center;letter-spacing:.04em;padding:12px;border-radius:12px;background:#fff;border:1px solid rgba(107,82,68,.25);margin:4px 0 12px}
  .btn{display:block;width:100%;padding:14px;border-radius:999px;background:var(--espresso);color:var(--cream);font:inherit;font-size:13px;letter-spacing:.18em;text-transform:uppercase;border:0;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn--ghost{background:transparent;color:var(--espresso);border:1px solid var(--espresso);margin-top:8px}
  .where{font-size:13px;line-height:1.55;margin-top:14px;color:var(--ink)}
  .where b{font-weight:500}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--espresso);color:var(--cream);padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{flex:1;padding:8px;border-radius:999px;border:1px solid var(--espresso);background:transparent;font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--espresso)}
  .tab.is-on{background:var(--espresso);color:var(--cream)}
  @media (max-width:980px){.app{grid-template-columns:1fr}.list{grid-template-columns:repeat(5,1fr);max-height:none}}
  @media (max-width:520px){.list{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <h1>Cadrage des photos</h1>
  <p>Choisis une photo, puis clique (ou fais glisser) sur la partie à garder visible. Copie le code et colle-le dans l'admin.</p>
</header>
<div class="app">
  <div class="panel">
    <div class="tabs"><button class="tab is-on" data-k="photographie">Photographie</button><button class="tab" data-k="photos_ugc">Photos Ugc</button></div>
    <div class="list" id="list"></div>
  </div>
  <div class="panel stage">
    <div class="pick" id="pick"><img id="big" alt=""><div class="dot" id="dot"></div></div>
    <p class="hint" id="hint">Clique sur la photo pour placer le point focal</p>
  </div>
  <div class="panel">
    <h2>Aperçu sur le site</h2>
    <div class="preview-wrap">
      <div><div class="preview"><img id="pv1" alt=""></div><p class="cap">Ordinateur</p></div>
      <div><div class="preview carre"><img id="pv2" alt=""></div><p class="cap">Format carré</p></div>
    </div>
    <h2>Code à coller</h2>
    <div class="code" id="code">50% 50%</div>
    <button class="btn" id="copy">Copier le code</button>
    <button class="btn btn--ghost" id="reset">Remettre au centre</button>
    <p class="where" id="where"></p>
  </div>
</div>
<div class="toast" id="toast">Code copié ✓</div>
<script>
(function () {
  var data = null, key = 'photographie', idx = 0, pos = { x: 50, y: 50 };
  var list = document.getElementById('list'), big = document.getElementById('big'), pick = document.getElementById('pick');
  var dot = document.getElementById('dot'), code = document.getElementById('code'), where = document.getElementById('where');
  var pv1 = document.getElementById('pv1'), pv2 = document.getElementById('pv2'), toast = document.getElementById('toast');
  function src(p) { return String(p || '').replace(/^\/+/, ''); }
  function items() { return ((data[key] && data[key].photos) || []).map(function (x) { return typeof x === 'string' ? { image: x } : x; }).filter(function (x) { return x.image; }); }
  function parse(c) { var m = /^(\d{1,3}(?:\.\d+)?)% (\d{1,3}(?:\.\d+)?)%$/.exec(String(c || '').replace(/\s+/g, ' ').trim()); return m ? { x: +m[1], y: +m[2] } : { x: 50, y: 50 }; }
  function txt() { return Math.round(pos.x) + '% ' + Math.round(pos.y) + '%'; }
  function draw() {
    dot.style.left = pos.x + '%'; dot.style.top = pos.y + '%';
    pv1.style.objectPosition = pv2.style.objectPosition = txt();
    code.textContent = txt();
  }
  function renderList() {
    var it = items();
    list.innerHTML = it.map(function (x, i) {
      return '<div class="thumb' + (i === idx ? ' is-active' : '') + (x.cadrage ? ' is-set' : '') + '" data-i="' + i + '"><img src="' + src(x.image) + '" alt="" loading="lazy" style="object-position:' + (x.cadrage || '50% 50%') + '"><span>' + (i + 1) + '</span></div>';
    }).join('');
  }
  function select(i) {
    var it = items(); if (!it[i]) return;
    idx = i; var x = it[i];
    big.src = pv1.src = pv2.src = src(x.image);
    pos = parse(x.cadrage); draw(); renderList();
    var sec = key === 'photographie' ? 'Photographie' : 'Photos UGC';
    where.innerHTML = 'Dans l’admin : <b>' + sec + '</b> → <b>Photos</b> → photo n° <b>' + (i + 1) + '</b>' + (x.marque ? ' (<b>' + x.marque.replace(/</g, '&lt;') + '</b>)' : '') + ' → champ <b>Point focal</b> → colle le code → <b>Save</b>.';
  }
  function setFrom(e) {
    var r = big.getBoundingClientRect();
    var p = e.touches ? e.touches[0] : e;
    pos.x = Math.max(0, Math.min(100, (p.clientX - r.left) / r.width * 100));
    pos.y = Math.max(0, Math.min(100, (p.clientY - r.top) / r.height * 100));
    draw();
  }
  var dragging = false;
  pick.addEventListener('pointerdown', function (e) { dragging = true; pick.setPointerCapture(e.pointerId); setFrom(e); });
  pick.addEventListener('pointermove', function (e) { if (dragging) setFrom(e); });
  pick.addEventListener('pointerup', function () { dragging = false; });
  list.addEventListener('click', function (e) { var t = e.target.closest('.thumb'); if (t) select(+t.getAttribute('data-i')); });
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('is-on', b === t); });
      key = t.getAttribute('data-k'); idx = 0; select(0);
    });
  });
  function flash(m) { toast.textContent = m; toast.classList.add('on'); setTimeout(function () { toast.classList.remove('on'); }, 1600); }
  document.getElementById('copy').addEventListener('click', function () {
    var v = txt();
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { flash('Code copié ✓ ' + v); }, function () {
      var ta = document.createElement('textarea'); ta.value = v; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); flash('Code copié ✓ ' + v);
    });
  });
  document.getElementById('reset').addEventListener('click', function () { pos = { x: 50, y: 50 }; draw(); });
  fetch('content.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (c) { data = c; select(0); });
})();
</script>
</body>
</html>
